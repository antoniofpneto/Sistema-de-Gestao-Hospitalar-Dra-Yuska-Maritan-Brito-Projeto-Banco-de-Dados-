<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dra. Yuska</title>
    <!-- Importando o Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <style>
        /* Transição suave e elegante para os links do menu */
        .nav-hover-effect {
            transition: all 0.2s ease-in-out !important; 
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Efeito de hover translúcido */
        .nav-hover-effect:hover {
            background-color: rgba(255, 255, 255, 0.12) !important;
            transform: translateY(-1px);
        }

        /* Estilização da Navbar Superior */
        .custom-navbar {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .08);
        }
    </style>

    <!-- Menu de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar mb-4 py-3">
        <div class="container-fluid px-4">
            <!-- Logo / Brand -->
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="{{ url_for('dashboard') }}">
                <div class="bg-white text-primary rounded-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 36px; height: 36px;">
                    <i class="bi bi-hospital-fill fs-5"></i>
                </div>
                <span>Hospital Dra. Yuska</span>
            </a>
            
            <!-- Botão Mobile -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Links da Navegação -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1 align-items-lg-center">
                    
                    <li class="nav-item">
                        <a class="nav-link text-white px-3 py-2 nav-hover-effect d-flex align-items-center gap-2" href="{{ url_for('listar_pacientes') }}">
                            <i class="bi bi-people"></i> Pacientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white px-3 py-2 nav-hover-effect d-flex align-items-center gap-2" href="{{ url_for('listar_profissionais') }}">
                            <i class="bi bi-person-badge"></i> Profissionais
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white px-3 py-2 nav-hover-effect d-flex align-items-center gap-2" href="{{ url_for('listar_atendimentos') }}">
                            <i class="bi bi-clipboard2-pulse"></i> Atendimentos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white px-3 py-2 nav-hover-effect d-flex align-items-center gap-2" href="{{ url_for('consultas_avancadas') }}">
                            <i class="bi bi-search-heart"></i> Consultas Avançadas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white px-3 py-2 nav-hover-effect d-flex align-items-center gap-2" href="{{ url_for('auditoria_atendimentos') }}">
                            <i class="bi bi-shield-check"></i> Auditoria
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white px-3 py-2 nav-hover-effect d-flex align-items-center gap-2" href="{{ url_for('listar_procedimentos') }}">
                            <i class="bi bi-heart-pulse"></i> Procedimentos
                        </a>
                    </li>
                    
                    <!-- Botão de Destaque para Concorrência -->
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a class="btn btn-sm btn-light text-primary fw-semibold rounded-pill px-3 py-2 shadow-sm d-flex align-items-center gap-2 transition-hover" href="{{ url_for('concorrencia_view') }}">
                            <i class="bi bi-shuffle"></i> Testar Concorrência
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Área dinâmica onde o conteúdo das outras páginas será injetado -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
