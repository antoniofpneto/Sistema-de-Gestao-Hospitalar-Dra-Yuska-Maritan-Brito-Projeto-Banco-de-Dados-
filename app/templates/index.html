<!-- app/templates/index.html -->
{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gestão de Pacientes</h2>
    <!-- Botão que abre o Modal de Cadastro -->
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCadastro">
        <i class="bi bi-person-plus"></i> Novo Paciente
    </button>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for p in pacientes %}
                <tr>
                    <td>{{ p.id_pessoa }}</td>
                    <td>{{ p.pessoa.nome }}</td>
                    <td>{{ p.pessoa.cpf }}</td>
                    <td>{{ p.pessoa.telefone }}</td>
                    <td>
                        <!-- Editar -->
                        <a href="/paciente/editar/{{ p.id_pessoa }}" class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <!-- Excluir (Formulário inline para segurança do método POST) -->
                        <form action="/paciente/deletar/{{ p.id_pessoa }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir?')">
                                <i class="bi bi-trash"></i> Excluir
                            </button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center text-muted">Nenhum paciente cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Modal de Cadastro de Paciente (Aparece ao clicar em "Novo Paciente") -->
<div class="modal fade" id="modalCadastro" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Cadastrar Novo Paciente</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="/paciente/novo" method="POST">
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Nome Completo</label>
                        <input type="text" class="form-control" name="nome" required>
                    </div>
                    <div class="mb-3">
                        <label>CPF (Apenas números)</label>
                        <input type="text" class="form-control" name="cpf" maxlength="11" required>
                    </div>
                    <div class="mb-3">
                        <label>Data de Nascimento</label>
                        <input type="date" class="form-control" name="data_nascimento" required>
                    </div>
                    <div class="mb-3">
                        <label>Telefone</label>
                        <input type="text" class="form-control" name="telefone" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success">Salvar Paciente</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
