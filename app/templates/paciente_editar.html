{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="mb-3">
            <a href="/paciente/{{ paciente.id_pessoa }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar ao Prontuário
            </a>
        </div>

        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Editar Dados do Paciente</h5>
                <span class="badge bg-light text-dark">ID: #{{ paciente.id_pessoa }}</span>
            </div>
            <div class="card-body">
                <form action="/paciente/editar/{{ paciente.id_pessoa }}" method="POST">
                    
                    <h6 class="text-muted mb-3">Informações Pessoais (Tabela Pessoa)</h6>
                    
                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" name="nome" value="{{ paciente.pessoa.nome }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">CPF (11 dígitos)</label>
                            <input type="text" class="form-control" name="cpf" value="{{ paciente.pessoa.cpf }}" maxlength="11" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Data de Nascimento</label>
                            <input type="date" class="form-control" name="data_nascimento" value="{{ paciente.pessoa.data_nascimento.strftime('%Y-%m-%d') }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefone (Só números)</label>
                            <input type="text" class="form-control" name="telefone" value="{{ paciente.pessoa.telefone }}" required>
                        </div>
                        <div class="col-md-6 mb-3 d-flex align-items-center">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" name="is_flamengo" id="is_flamengo" {% if paciente.pessoa.is_flamengo %}checked{% endif %}>
                                <label class="form-check-label fw-bold text-danger" for="is_flamengo">
                                    É Flamenguista? 🔴⚫
                                </label>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">
                    <h6 class="text-muted mb-3">Informações Clínicas/Convênio (Tabela Paciente)</h6>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Número do Convênio</label>
                            <input type="text" class="form-control" name="num_convenio" value="{{ paciente.num_convenio or '' }}" placeholder="Deixe em branco para SUS">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Grupo Sanguíneo</label>
                            <select class="form-select" name="grupo_sanguineo" required>
                                {% set tipos = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                                {% for tipo in tipos %}
                                    <option value="{{ tipo }}" {% if paciente.grupo_sanguineo == tipo %}selected{% endif %}>{{ tipo }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="/paciente/{{ paciente.id_pessoa }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Salvar Alterações</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
